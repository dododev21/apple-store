spring:
  application:
    name: apple-store
  datasource:
    url: jdbc:h2:file:./data/applestore;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    com.applestore: INFO
