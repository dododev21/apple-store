<section class="hero">

  <div class="hero-content">

    <span>Apple Watch</span>

    <h1>WATCH</h1>

    <p>

      손목 위의 미래.
    </p>

    <div class="buttons">
      <button>구입하기</button>
      <button class="outline">더 알아보기</button>

  </div>

    <img src="../assets/images/watch/watch-main.png" alt="Apple Watch">

</section>

<section class="ultra-section">

    <h2>Ultra.</h2>
  </div>

  <div class="ultra-image">
    <img src="../assets/images/watch/ultra.png" alt="Apple Watch Ultra">
  </div>

</section>

<section class="lineup">

  <div class="section-title">
    <h2>라인업.</h2>

    </div>

    <div class="watch-card">
      <img src="../assets/images/watch/watch-se.png" alt="Apple Watch SE">
      <h3>Apple Watch SE</h3>
    </div>

    <div class="watch-card">
      <img src="../assets/images/watch/ultra.png" alt="Apple Watch Ultra">

  </div>

</section>

<section class="features">

  <div class="feature-card large">
    <img src="../assets/images/watch/service01.png" alt="Fitness+">

    <div class="overlay">
      <h2>Fitness+</h2>
      <p>더 건강한 하루를 위한 동기부여.</p>
    </div>

  </div>

  <div class="feature-card">
    <img src="../assets/images/watch/service02.png" alt="">
  </div>

  <div class="feature-card">
    <img src="../assets/images/watch/service03.png" alt="">

  <div class="feature-card wide">
    <img src="../assets/images/watch/service04.png" alt="">

      <h2>새로운 밴드.</h2>

  <div class="health-grid">

    <div class="health-card">
      <img src="../assets/images/watch/bnr01.png" alt="">

    <div class="health-card">
      <img src="../assets/images/watch/bnr02.png" alt="">
    </div>

    <div class="health-card">
      <img src="../assets/images/watch/bnr03.png" alt="">

  </div>
