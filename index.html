  <div class="logo-wrap">

  <nav class="nav">

    <div class="hero-buttons">
      <button>구매하기</button>
      <button class="outline">더 알아보기</button>
    </div>
  </div>

  <img src="assets/images/main/main_img01.png" alt="Main Visual">

<section class="category-section">

  <a href="pages/mac.html" class="category-card">
    <img src="assets/images/main/mac.png" alt="Mac">

  </a>

  <a href="pages/ipad.html" class="category-card">
    <img src="assets/images/main/ipad.png" alt="iPad">

  </a>

  <a href="pages/iphone.html" class="category-card">
    <img src="assets/images/main/iphone.png" alt="iPhone">

    <img src="assets/images/main/watch.png" alt="Watch">

    <img src="assets/images/main/airpods.png" alt="AirPods">

  </div>

  <div class="product-card dark">
    <img src="assets/images/main/iphone_pro.jpg" alt="iPhone Pro">

      <h2>iPhone 17 Pro</h2>
      <p>프로 그 이상의 퍼포먼스.</p>
    </div>
  </div>

  <div class="product-card light">
    <img src="assets/images/main/iphone_air.jpg" alt="iPhone Air">
    <div class="content">
      <h2>iPhone Air</h2>

  </div>

  <div class="product-card purple">
    <img src="assets/images/main/iphone17.jpg" alt="iPhone 17">
    <div class="content">
      <h2>iPhone 17</h2>
      <p>새로운 컬러, 새로운 감성.</p>
    </div>
  </div>

  <div class="product-card pink">
    <img src="assets/images/main/iphone17e.jpg" alt="iPhone 17e">
    <div class="content">
      <h2>iPhone 17e</h2>
